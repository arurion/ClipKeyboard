name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write   # Releaseへのアセットアップロードに必要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # デフォルトは packages: 'tools platform-tools' だが、Google がSDKリポジトリから
          # 廃止済みの legacy 'tools' パッケージを削除したため、それを含むデフォルト値のまま
          # 実行すると `Warning: Failed to find package 'tools'` で失敗するようになった
          # (2026-09-14頃から世界中のCIで発生している既知の破壊的変更)。
          # tools 自体はこのプロジェクトで使っていないので明示的に外す。
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ClipKeyboard-debug
          path: app/build/outputs/apk/debug/*.apk

      # --- 一時的なデバッグステップ: secretsが本当にこのジョブへ届いているか確認する ---
      # 値そのものは出力せず、文字数だけを表示する(0なら未設定/空、それ以外なら届いている)。
      # 原因を特定できたら、このステップごと削除して構わない。
      - name: DEBUG - secrets length check
        env:
          D1: ${{ secrets.RELEASE_STORE_BASE64 }}
          D2: ${{ secrets.RELEASE_STORE_PASSWORD }}
          D3: ${{ secrets.RELEASE_KEY_ALIAS }}
          D4: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "RELEASE_STORE_BASE64 length:    ${#D1}"
          echo "RELEASE_STORE_PASSWORD length:  ${#D2}"
          echo "RELEASE_KEY_ALIAS length:       ${#D3}"
          echo "RELEASE_KEY_PASSWORD length:    ${#D4}"

      # `if:` 内で secrets コンテキストを直接評価できないため(Unrecognized named-value: 'secrets')、
      # 一度 env 経由でこのstepの中で判定し、outputsとして次のstepへ渡す。
      - name: Check signing secrets
        id: check_signing
        env:
          KS_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo "KS_B64 length: ${#KS_B64}"
          if [ -n "$KS_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.check_signing.outputs.has_keystore == 'true'
        env:
          KS_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      # app/build.gradle.kts はこの4つの環境変数(またはGradleプロパティ)が
      # すべて揃っている場合のみ本番署名を使い、揃っていなければ自動でデバッグ署名に
      # フォールバックする。そのためsigned/unsignedでstepを分けず1本にできる。
      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ClipKeyboard-release
          path: app/build/outputs/apk/release/*.apk

      # keystoreファイルをrunner上に残さない
      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      # ---- ここからRelease連携 ----
      # 以下のいずれかの場合にのみ実行される:
      #   1. "v1.0.0" のようなタグをpushしたとき(タグ名からリリースを自動作成)
      #   2. GitHub UI/APIで Release を作成したとき (release: created)
      - name: Check if this run should publish to a Release
        id: check_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [ "${{ github.event_name }}" = "release" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APKs for release (avoid name collisions)
        if: steps.check_release.outputs.should_publish == 'true'
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/*.apk   "release_assets/ClipKeyboard-debug.apk"   || true
          cp app/build/outputs/apk/release/*.apk "release_assets/ClipKeyboard-release.apk" || true

      - name: Publish APKs to GitHub Release
        if: steps.check_release.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.apk
          # release イベント起点なら既存のReleaseに追加、tag pushならこのタグ名でReleaseを新規作成
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
